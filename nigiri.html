<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A kids' sushi restaurant game. Build nigiri and send it down the conveyor belt.">
<meta property="og:type" content="website">
<meta property="og:title" content="Nigiri Builder">
<meta property="og:description" content="Chef Lennox at the sushi counter. Build sushi layer by layer and send it down the conveyor belt. Free to play in any browser.">
<meta property="og:url" content="https://catnolapumpkin.github.io/nigiri-builder/">
<meta property="og:image" content="https://catnolapumpkin.github.io/nigiri-builder/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="627">

<title>Nigiri Builder</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Fredoka:wght@400;500;600&display=swap">
<style>
/* Layout: a noren-blue sushi restaurant. Top: customers seated over a moving conveyor belt. Middle: order ticket beside the hinoki cutting board. Bottom: ingredient trays. Single-theme by choice. */
:root{
  --noren:#1d3557; --noren-deep:#14263f; --hinoki:#e9c99a; --hinoki-edge:#c9a26c;
  --paper:#fbf7ef; --ink:#1b1f2a; --ink-soft:#5b6170; --shoyu:#3a2416;
  --good:#2f9e5b; --oops:#d1495b; --gold:#f2b134; --belt:#3d4452; --belt-light:#59616f; --lantern:#e4572e;
  --display:"Mochiy Pop One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--noren);color:var(--paper);font-family:var(--body);font-size:17px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px;
  background-image:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.03) 46px 48px)}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,44px);margin:0;letter-spacing:.5px;text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-size:15px;letter-spacing:2px;text-transform:uppercase;opacity:.75;margin-top:4px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.chip{background:var(--noren-deep);border:2px solid rgba(255,255,255,.15);border-radius:999px;padding:6px 14px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center}
.chip b{color:var(--gold);font-size:20px}

/* restaurant */
.restaurant{background:var(--noren-deep);border-radius:16px;overflow:hidden;border:3px solid rgba(255,255,255,.08)}
.noren-cloth{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 10px}
.noren-cloth div{background:var(--noren);border-radius:0 0 8px 8px;height:34px;display:grid;place-items:center;font-family:var(--display);font-size:16px;color:var(--paper);opacity:.9}
.goal{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px 4px}
.clock{font-family:var(--display);font-size:20px;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.clock svg{width:28px;height:28px}
.goal-text{font-weight:500}
.goal-text b{color:var(--gold)}
.goal-dots{display:flex;gap:6px;flex-wrap:wrap}
.goal-dots span{width:26px;height:26px;border-radius:50%;border:2px dashed rgba(255,255,255,.35);display:grid;place-items:center}
.goal-dots span.done{border:2px solid var(--gold);background:rgba(242,177,52,.2)}
.goal-dots svg{width:22px;height:16px}
.seats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 10px 0;position:relative}
.seat{display:grid;justify-items:center;gap:2px;position:relative;padding-top:20px}
.seat svg.face{width:min(86px,22vw);height:auto;transition:transform .3s}
.seat.ordering svg.face{animation:wiggle 1.6s ease-in-out infinite}
.seat .name{font-size:14px;font-weight:600;opacity:.85;text-align:center}
.seat .tag{position:absolute;top:0;background:var(--gold);color:var(--ink);font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;letter-spacing:1px;text-transform:uppercase}
.seat .yum{position:absolute;top:0;background:var(--good);color:#fff;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.belt{position:relative;height:78px;background:var(--belt);border-top:6px solid #2a2f39;border-bottom:6px solid #2a2f39;overflow:hidden}
.belt::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,var(--belt) 0 34px,var(--belt-light) 34px 38px);animation:roll 1.2s linear infinite}
@keyframes roll{to{transform:translateX(38px)}}
.belt::before{left:-38px}
.belt-plate{position:absolute;top:6px;width:84px;height:62px;display:grid;place-items:center;border-radius:50%;
  background:radial-gradient(ellipse at center,#fff 0 55%,var(--plate,#7fb3d5) 56% 70%,#fff 71%);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.belt-plate svg{width:66px;height:46px;margin-top:-6px}
.belt-plate.ambient{animation:drift linear infinite;opacity:.7}
@keyframes drift{from{left:-100px}to{left:calc(100% + 20px)}}
.belt-plate.served{transition:left 1.4s cubic-bezier(.4,0,.3,1),opacity .4s,transform .4s;z-index:2}
.belt-plate.eaten{opacity:0;transform:translateY(-30px) scale(.6)}

.stage{display:grid;grid-template-columns:240px 1fr;gap:16px}
@media (max-width:700px){.stage{grid-template-columns:1fr}}
.ticket{background:var(--paper);color:var(--ink);border-radius:6px;padding:14px 14px 18px;position:relative;min-width:0;
  box-shadow:0 6px 0 var(--noren-deep);display:grid;gap:6px;align-content:start}
.ticket::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:10px;
  background:radial-gradient(circle at 6px 0,transparent 6px,var(--paper) 6.5px) 0 0/12px 10px repeat-x}
.ticket .label{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.ticket .who{font-family:var(--display);font-size:20px}
.ticket svg{width:100%;height:auto;background:#f1e8d6;border-radius:6px}
.ticket .order-words{font-weight:500;line-height:1.35}
.ticket .order-words span{color:var(--ink-soft)}
.board-area{display:grid;gap:12px;min-width:0}
.board{border-radius:14px;border:4px solid var(--hinoki-edge);min-height:250px;display:grid;place-items:center;position:relative;overflow:hidden;
  background:repeating-linear-gradient(178deg,rgba(150,100,50,.08) 0 3px,transparent 3px 19px),linear-gradient(180deg,var(--hinoki),#e2bd88)}
.board #plate svg{width:min(380px,90%);height:auto;display:block;margin:0 auto;overflow:visible}
.board #plate{width:100%}
.layer{transform-box:view-box;transform-origin:100px 128px}
.layer.drop{animation:drop .7s cubic-bezier(.3,0,.3,1)}
@keyframes drop{
  0%{transform:translateY(-120px) scale(.9,1.1);opacity:0}
  45%{transform:translateY(0) scale(1.18,.78);opacity:1}
  62%{transform:translateY(-22px) scale(.94,1.08)}
  78%{transform:translateY(0) scale(1.06,.94)}
  90%{transform:translateY(-5px) scale(1,1)}
  100%{transform:translateY(0) scale(1,1)}
}
.whole.jump{animation:jump .6s ease-out}
@keyframes jump{0%,100%{transform:translateY(0)}30%{transform:translateY(-34px) scale(1.05)}60%{transform:translateY(0) scale(1.08,.92)}80%{transform:translateY(-8px)}}
.whole{transform-box:view-box;transform-origin:100px 128px}
.shadow.drop{animation:shadow .7s ease-out}
@keyframes shadow{0%{transform:scale(.4);opacity:.2}45%{transform:scale(1.15)}100%{transform:scale(1)}}
.board .hint{position:absolute;top:12px;left:0;right:0;text-align:center;color:var(--shoyu);font-weight:600;font-size:16px}
.bubble{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:8px 16px;border-radius:999px;font-weight:600;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.bubble.good{background:var(--good);color:#fff}.bubble.oops{background:var(--oops);color:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap}
button{font-family:var(--body);font-size:18px;font-weight:600;cursor:pointer;border:none;border-radius:14px;padding:12px 18px;color:var(--ink);background:var(--paper);box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed}
.serve{background:var(--gold);flex:1;font-family:var(--display);font-weight:400;font-size:22px;min-width:150px}
.trays{display:grid;gap:12px}
.tray{background:var(--noren-deep);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.tray h2{margin:0;font-size:13px;letter-spacing:2px;text-transform:uppercase;font-weight:600;opacity:.8}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.item{display:grid;justify-items:center;gap:2px;padding:8px 6px;font-size:15px;line-height:1.1}
.item svg{width:64px;height:44px}
.item small{font-weight:400;color:var(--ink-soft);font-size:12px}
.item.on{outline:3px solid var(--gold);outline-offset:-3px;background:#fff4d6}
.banner{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);opacity:0;background:var(--gold);color:var(--ink);font-family:var(--display);font-size:clamp(22px,5vw,34px);padding:18px 28px;border-radius:18px;box-shadow:0 8px 0 rgba(0,0,0,.25);z-index:6;text-align:center;pointer-events:none;transition:all .35s cubic-bezier(.3,1.6,.5,1);max-width:90vw}
.banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.banner small{display:block;font-family:var(--body);font-size:17px;font-weight:600;margin-top:6px}
.confetti{position:fixed;pointer-events:none;top:-10px;width:10px;height:14px;border-radius:2px;animation:fall 1.4s ease-in forwards;z-index:5}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){
  .confetti{display:none}.layer.drop,.whole.jump,.shadow.drop,.seat.ordering svg.face,.belt::before,.belt-plate.ambient{animation:none}
  .belt-plate.ambient{display:none}
}
footer{opacity:.6;font-size:14px;text-align:center}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Nigiri Builder<small>Chef Lennox at the sushi counter</small></h1>
    <div class="stats">
      <div class="chip">Plates <b id="score">0</b></div>
      <div class="chip">Streak <b id="streak">0</b></div>
      <div class="chip" id="rank">Rice Rookie</div>
    </div>
  </header>

  <section class="restaurant" aria-label="Sushi restaurant">
    <div class="noren-cloth" aria-hidden="true"><div>寿</div><div>司</div><div>す</div><div>し</div></div>
    <div class="goal">
      <div class="clock"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="#fbf7ef" stroke="#f2b134" stroke-width="3"/><line id="hourHand" x1="20" y1="20" x2="20" y2="11" stroke="#1b1f2a" stroke-width="3" stroke-linecap="round"/><line x1="20" y1="20" x2="27" y2="20" stroke="#1b1f2a" stroke-width="2" stroke-linecap="round"/></svg><span id="clockText">11:00 AM</span></div>
      <div class="goal-text" id="goalText"></div>
      <div class="goal-dots" id="goalDots"></div>
    </div>
    <div class="seats" id="seats"></div>
    <div class="belt" id="belt"></div>
  </section>

  <div class="stage">
    <aside class="ticket" aria-live="polite">
      <div class="label">Order up</div>
      <div class="who" id="who">Seat 1</div>
      <div id="orderPic"></div>
      <div class="order-words" id="orderWords"></div>
    </aside>

    <section class="board-area">
      <div class="board" id="board">
        <div class="hint" id="hint">Start with rice!</div>
        <div id="plate"></div>
        <div class="bubble" id="bubble" hidden></div>
      </div>
      <div class="actions">
        <button id="undo" type="button">Undo</button>
        <button id="clear" type="button">Start over</button>
        <button id="serve" class="serve" type="button">Serve it!</button>
      </div>
    </section>
  </div>

  <div class="trays">
    <div class="tray"><h2>1 · Rice</h2><div class="items" id="riceTray"></div></div>
    <div class="tray"><h2>2 · Topping</h2><div class="items" id="fishTray"></div></div>
    <div class="tray"><h2>3 · Finishing touch</h2><div class="items" id="extraTray"></div></div>
  </div>
  <footer>Rebuilt from the Code in Place original.</footer>
</div>
<div class="banner" id="banner" aria-live="polite"></div>

<script>
const FISH={
  sake:{name:"Salmon",jp:"sake",base:"#f4895f",stripe:"#ffd8c4"},
  maguro:{name:"Tuna",jp:"maguro",base:"#c8283c",stripe:"#e8606f"},
  ebi:{name:"Shrimp",jp:"ebi",base:"#ff9b6a",stripe:"#fff1e6"},
  unagi:{name:"Eel",jp:"unagi",base:"#7a4421",stripe:"#4a2610"},
  tamago:{name:"Egg",jp:"tamago",base:"#f7d046",stripe:"#e9b92a"},
  avocado:{name:"Avocado",jp:"abokado",base:"#8fbf4a",stripe:"#d5e88f"}
};
const EXTRA={
  none:{name:"Plain",jp:"nothing"},
  nori:{name:"Seaweed belt",jp:"nori"},
  sesame:{name:"Sesame seeds",jp:"goma"},
  wasabi:{name:"Wasabi dot",jp:"wasabi"}
};
const GUESTS=[
  {n:"Grandpa",c:"#c99a6b",h:"#e8e8e8"},{n:"Grandma",c:"#a8724a",h:"#bdbdbd"},{n:"Hungry Cat",c:"#f2a65a",cat:1},
  {n:"Robot Rex",c:"#9fb4c7",bot:1},{n:"Mom",c:"#8d5a3b",h:"#2b1a12"},{n:"Sleepy Panda",c:"#ffffff",panda:1},
  {n:"Astronaut Ada",c:"#f0c8a0",h:"#5a3a22"},{n:"Captain Pirate",c:"#d9a77a",h:"#222",pirate:1},
  {n:"Uncle",c:"#6b4430",h:"#1a1a1a"},{n:"Coach",c:"#e0b48a",h:"#7a4a22"}
];
const RANKS=[[0,"Rice Rookie"],[3,"Fish Friend"],[7,"Roll Rider"],[12,"Sushi Star"],[20,"Master Chef"],[35,"Sushi Legend"]];
const PLATE_COLORS=["#7fb3d5","#e4572e","#f2b134","#8fbf4a","#b07cc6"];

function riceSVG(){
  let g=`<ellipse cx="100" cy="98" rx="78" ry="30" fill="#fdfcf7" stroke="#d9d2c0" stroke-width="2"/>`;
  const dots=[[52,92],[70,104],[88,90],[108,106],[126,94],[146,102],[62,112],[98,114],[136,114],[118,84],[80,82],[154,90]];
  dots.forEach(([x,y])=>g+=`<ellipse cx="${x}" cy="${y}" rx="5" ry="2.6" fill="#ece6d4" transform="rotate(${(x*7)%60-30} ${x} ${y})"/>`);
  return g;
}
function fishSVG(k){
  const f=FISH[k];
  if(k==="tamago") return `<rect x="26" y="52" width="148" height="40" rx="8" fill="${f.base}" stroke="${f.stripe}" stroke-width="3"/><line x1="30" y1="66" x2="170" y2="66" stroke="${f.stripe}" stroke-width="2"/><line x1="30" y1="78" x2="170" y2="78" stroke="${f.stripe}" stroke-width="2"/>`;
  if(k==="avocado") return [0,1,2,3,4].map(i=>`<path d="M${30+i*28} 86 q14 -42 34 -30 q-4 28 -34 30z" fill="${f.base}" stroke="${f.stripe}" stroke-width="3"/>`).join("");
  let s=`<path d="M22 80 Q30 46 100 48 Q172 46 180 80 Q176 94 100 92 Q26 94 22 80z" fill="${f.base}"/>`;
  for(let i=0;i<5;i++){const x=48+i*26;s+=`<path d="M${x} 52 q10 18 4 38" stroke="${f.stripe}" stroke-width="4" fill="none" stroke-linecap="round" opacity=".85"/>`}
  if(k==="ebi") s+=`<path d="M176 74 l20 -14 l-4 18 l6 14 l-22 -8z" fill="#e2502e"/>`;
  if(k==="unagi") s+=`<path d="M30 62 Q100 50 172 62" stroke="#c98a3c" stroke-width="3" fill="none" opacity=".7"/>`;
  return s;
}
function extraSVG(k){
  if(k==="nori") return `<rect x="86" y="44" width="30" height="86" rx="3" fill="#1f2b1f"/><rect x="90" y="48" width="4" height="78" fill="#33463a"/>`;
  if(k==="sesame") return [[60,58],[80,64],[100,56],[118,66],[138,58],[90,72],[128,74],[70,74]].map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="3.5" ry="2" fill="#fffbe8" stroke="#bfae80" stroke-width=".6"/>`).join("");
  if(k==="wasabi") return `<path d="M88 50 q12 -14 26 0 q4 10 -12 12 q-18 -2 -14 -12z" fill="#7cbf3a" stroke="#5a9426" stroke-width="2"/>`;
  return "";
}
// newLayer: which layer should play the drop-and-bounce animation
function nigiriSVG(p,w=200,h=140,newLayer=null){
  const cls=l=>`layer${newLayer===l?" drop":""}`;
  let g=`<svg viewBox="0 0 200 140" width="${w}" height="${h}" role="img" aria-label="${describe(p)}">`;
  g+=`<ellipse class="shadow${newLayer?" drop":""}" style="transform-box:fill-box;transform-origin:center" cx="100" cy="128" rx="80" ry="8" fill="rgba(0,0,0,.14)"/><g class="whole">`;
  if(p.rice) g+=`<g class="${cls("rice")}">${riceSVG()}</g>`;
  if(p.fish) g+=`<g class="${cls("fish")}">${fishSVG(p.fish)}</g>`;
  if(p.extra && p.extra!=="none") g+=`<g class="${cls("extra")}">${extraSVG(p.extra)}</g>`;
  return g+`</g></svg>`;
}
function describe(p){
  if(!p.rice) return "Empty board";
  let t=p.fish?FISH[p.fish].name:"plain rice";
  if(p.extra && p.extra!=="none") t+=" with "+EXTRA[p.extra].name.toLowerCase();
  return t;
}
function faceSVG(g,happy){
  const mouth=happy?`<path d="M34 62 Q50 80 66 62 Z" fill="#7a2230"/>`:`<path d="M38 64 Q50 72 62 64" stroke="#1b1f2a" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  const eyes=happy?`<path d="M32 46 q6 -7 12 0 M56 46 q6 -7 12 0" stroke="#1b1f2a" stroke-width="3" fill="none" stroke-linecap="round"/>`:`<circle cx="38" cy="46" r="4.5" fill="#1b1f2a"/><circle cx="62" cy="46" r="4.5" fill="#1b1f2a"/>`;
  const blush=happy?`<circle cx="28" cy="58" r="5" fill="#f28b9b" opacity=".7"/><circle cx="72" cy="58" r="5" fill="#f28b9b" opacity=".7"/>`:"";
  let s=`<svg class="face" viewBox="0 0 100 100" aria-hidden="true">`;
  if(g.cat) s+=`<path d="M18 36 L24 8 L42 26 Z M82 36 L76 8 L58 26 Z" fill="${g.c}"/>`;
  if(g.panda) s+=`<circle cx="22" cy="20" r="11" fill="#222"/><circle cx="78" cy="20" r="11" fill="#222"/>`;
  if(g.bot) s+=`<line x1="50" y1="14" x2="50" y2="2" stroke="#5b6170" stroke-width="3"/><circle cx="50" cy="3" r="4" fill="#e4572e"/>`;
  s+=g.bot?`<rect x="12" y="14" width="76" height="76" rx="16" fill="${g.c}"/>`:`<circle cx="50" cy="52" r="38" fill="${g.c}"/>`;
  if(g.h) s+=`<path d="M14 44 Q16 12 50 12 Q84 12 86 44 Q70 26 50 28 Q30 26 14 44z" fill="${g.h}"/>`;
  if(g.pirate) s+=`<path d="M10 30 Q50 -4 90 30 Z" fill="#222"/><circle cx="50" cy="20" r="4" fill="#fff"/>`;
  if(g.panda) s+=`<ellipse cx="37" cy="46" rx="10" ry="8" fill="#222"/><ellipse cx="63" cy="46" rx="10" ry="8" fill="#222"/>`;
  const e=g.panda&&!happy?eyes.replaceAll("#1b1f2a","#fff"):(g.panda?eyes.replaceAll("#1b1f2a","#fff"):eyes);
  s+=e+blush+mouth;
  if(g.cat) s+=`<path d="M20 60 l-14 -2 M20 64 l-14 4 M80 60 l14 -2 M80 64 l14 4" stroke="#7a4a22" stroke-width="2"/>`;
  return s+`</svg>`;
}

let state={plate:{rice:false,fish:null,extra:null},history:[],order:null,score:0,streak:0,
  seats:[null,null,null],orderSeat:0,happySeat:-1,hour:0,goal:null,busy:false};
try{const s=JSON.parse(localStorage.getItem("nigiri-builder")||"{}");if(s.score)state.score=s.score;if(s.hour)state.hour=s.hour}catch(e){}
function save(){try{localStorage.setItem("nigiri-builder",JSON.stringify({score:state.score,hour:state.hour}))}catch(e){}}
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- shift clock & hourly goal ---------- */
function clockLabel(h){const t=11+h;const hr=((t-1)%12)+1;const ap=(Math.floor(t/12)%2)?"PM":"AM";return `${hr}:00 ${ap}`}
function newGoal(){
  const n=Math.min(2+state.hour,6);
  let fish=pick(Object.keys(FISH));
  if(state.goal) while(fish===state.goal.fish) fish=pick(Object.keys(FISH));
  state.goal={fish,n,done:0};
}
function renderGoal(){
  const g=state.goal;
  document.getElementById("clockText").textContent=clockLabel(state.hour);
  const t=11+state.hour;document.getElementById("hourHand").setAttribute("transform",`rotate(${(t%12)*30} 20 20)`);
  document.getElementById("goalText").innerHTML=`This hour, make <b>${g.n} ${FISH[g.fish].name}</b> nigiri`;
  const mini=`<svg viewBox="0 0 200 140">${riceSVG()}${fishSVG(g.fish)}</svg>`;
  document.getElementById("goalDots").innerHTML=Array.from({length:g.n},(_,i)=>`<span class="${i<g.done?"done":""}">${i<g.done?mini:""}</span>`).join("");
}

/* ---------- customers ---------- */
function seatGuests(){
  const used=new Set(state.seats.filter(Boolean).map(g=>g.n));
  state.seats=state.seats.map(g=>{if(g)return g;let n;do{n=pick(GUESTS)}while(used.has(n.n));used.add(n.n);return n});
}
function renderSeats(){
  document.getElementById("seats").innerHTML=state.seats.map((g,i)=>`
    <div class="seat ${i===state.orderSeat&&!state.busy?"ordering":""}">
      ${i===state.happySeat?`<span class="yum">Yum!</span>`:(i===state.orderSeat&&!state.busy?`<span class="tag">Ordering</span>`:"")}
      ${faceSVG(g,i===state.happySeat)}
      <div class="name">${g.n}</div>
    </div>`).join("");
}

/* ---------- conveyor belt ---------- */
function ambientBelt(){
  const belt=document.getElementById("belt");
  for(let i=0;i<4;i++){
    const d=document.createElement("div");d.className="belt-plate ambient";
    const p={rice:true,fish:pick(Object.keys(FISH)),extra:pick(Object.keys(EXTRA))};
    d.style.setProperty("--plate",pick(PLATE_COLORS));
    d.style.animationDuration="16s";d.style.animationDelay=(-i*4)+"s";
    d.innerHTML=nigiriSVG(p,66,46);belt.append(d);
  }
}
function sendDownBelt(p,seat,done){
  const belt=document.getElementById("belt");
  const d=document.createElement("div");d.className="belt-plate served";
  d.style.setProperty("--plate","#f2b134");d.style.left="-100px";
  d.innerHTML=nigiriSVG(p,66,46);belt.append(d);
  const target=()=>{const w=belt.clientWidth;return (w*(seat*2+1)/6-42)+"px"};
  requestAnimationFrame(()=>requestAnimationFrame(()=>{d.style.left=target()}));
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(()=>{d.classList.add("eaten");done();setTimeout(()=>d.remove(),500)},reduce?200:1450);
}

/* ---------- orders ---------- */
function newOrder(){
  const fishes=Object.keys(FISH), extras=Object.keys(EXTRA);
  const easy=state.score<3;
  let o;
  do{
    const fish=Math.random()<.6?state.goal.fish:pick(fishes);
    o={rice:true,fish,extra:easy?"none":pick(extras)};
  }while(state.order && o.fish===state.order.fish && o.extra===state.order.extra);
  state.order=o;
  let s;do{s=Math.floor(Math.random()*3)}while(s===state.orderSeat&&Math.random()<.7);
  state.orderSeat=s;
  const g=state.seats[s];
  document.getElementById("who").textContent=`${g.n} · Seat ${s+1}`;
  document.getElementById("orderPic").innerHTML=nigiriSVG(o);
  const ex=o.extra==="none"?"":`<br>+ ${EXTRA[o.extra].name} <span>(${EXTRA[o.extra].jp})</span>`;
  document.getElementById("orderWords").innerHTML=`${FISH[o.fish].name} <span>(${FISH[o.fish].jp})</span> on rice${ex}`;
}

function render(newLayer){
  const p=state.plate;
  document.getElementById("plate").innerHTML=nigiriSVG(p,380,266,newLayer);
  document.getElementById("hint").textContent=!p.rice?"Start with rice!":!p.fish?"Now add a topping":"Add a finishing touch, or serve!";
  document.getElementById("score").textContent=state.score;
  document.getElementById("streak").textContent=state.streak;
  let r=RANKS[0][1];RANKS.forEach(([n,t])=>{if(state.score>=n)r=t});
  document.getElementById("rank").textContent=r;
  document.querySelectorAll(".item").forEach(b=>{
    const {kind,key}=b.dataset;
    b.classList.toggle("on",(kind==="rice"&&p.rice)||(kind==="fish"&&p.fish===key)||(kind==="extra"&&p.extra===key));
    b.disabled=state.busy||(kind==="fish"&&!p.rice)||(kind==="extra"&&!p.fish);
  });
  document.getElementById("undo").disabled=state.busy||!state.history.length;
  document.getElementById("clear").disabled=state.busy;
  document.getElementById("serve").disabled=state.busy||!p.rice;
  renderSeats();renderGoal();
}

function makeItem(kind,key,label,jp,svg){
  const b=document.createElement("button");b.type="button";b.className="item";
  b.dataset.kind=kind;b.dataset.key=key;b.id=`item-${kind}-${key}`;
  b.innerHTML=`<svg viewBox="0 0 200 140">${svg}</svg>${label}<small>${jp}</small>`;
  b.onclick=()=>add(kind,key);return b;
}
document.getElementById("riceTray").append(makeItem("rice","rice","Sushi rice","shari",riceSVG()));
Object.entries(FISH).forEach(([k,f])=>document.getElementById("fishTray").append(makeItem("fish",k,f.name,f.jp,`<ellipse cx="100" cy="98" rx="78" ry="30" fill="#f3efe2"/>`+fishSVG(k))));
Object.entries(EXTRA).forEach(([k,e])=>document.getElementById("extraTray").append(makeItem("extra",k,e.name,e.jp,k==="none"?`<text x="100" y="86" text-anchor="middle" font-size="40" fill="#8a8f9c" font-family="sans-serif">—</text>`:`<ellipse cx="100" cy="98" rx="78" ry="30" fill="#f3efe2"/>`+extraSVG(k))));

function add(kind,key){
  if(state.busy)return;
  state.history.push(JSON.stringify(state.plate));
  if(kind==="rice")state.plate.rice=true;
  if(kind==="fish")state.plate.fish=key;
  if(kind==="extra")state.plate.extra=key;
  tone(kind==="rice"?392:kind==="fish"?523:659,.08);
  setTimeout(()=>tone(kind==="rice"?494:kind==="fish"?659:784,.06),260);
  hideBubble();render(kind==="extra"&&key==="none"?null:kind);
}
document.getElementById("undo").onclick=()=>{if(state.history.length&&!state.busy){state.plate=JSON.parse(state.history.pop());hideBubble();render()}};
document.getElementById("clear").onclick=()=>{if(state.busy)return;state.plate={rice:false,fish:null,extra:null};state.history=[];hideBubble();render()};

function bubble(t,cls){const b=document.getElementById("bubble");b.textContent=t;b.className="bubble "+cls;b.hidden=false}
function hideBubble(){document.getElementById("bubble").hidden=true}
function banner(t,sub){const b=document.getElementById("banner");b.innerHTML=`${t}<small>${sub}</small>`;b.classList.add("show");setTimeout(()=>b.classList.remove("show"),2200)}

document.getElementById("serve").onclick=()=>{
  if(state.busy)return;
  const p=state.plate,o=state.order;
  const ex=p.extra||"none";
  if(p.rice&&p.fish===o.fish&&ex===o.extra){
    state.busy=true;state.score++;state.streak++;
    bubble(pick(["Oishii! Yummy!","Perfect plate!","Arigato, chef!","So tasty!","Sushi superstar!"]),"good");
    const w=document.querySelector("#plate .whole");if(w)w.classList.add("jump");
    [523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.12),i*110));
    const served={...p},seat=state.orderSeat;
    let hourDone=false;
    if(o.fish===state.goal.fish){state.goal.done++;if(state.goal.done>=state.goal.n)hourDone=true}
    render();
    setTimeout(()=>{
      state.plate={rice:false,fish:null,extra:null};state.history=[];hideBubble();render();
      sendDownBelt(served,seat,()=>{
        state.happySeat=seat;render();tone(880,.1);confetti(14);
        setTimeout(()=>{
          state.happySeat=-1;state.seats[seat]=null;seatGuests();
          if(hourDone){
            banner(`${clockLabel(state.hour)} goal complete!`,`${state.goal.n} ${FISH[state.goal.fish].name} nigiri made`);
            [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.14),i*130));confetti(40);
            state.hour++;newGoal();
          }
          save();state.busy=false;newOrder();render();
        },1100);
      });
    },700);
  }else{
    state.streak=0;
    let msg="Hmm, check the order!";
    if(!p.fish)msg="It needs a topping!";
    else if(p.fish!==o.fish)msg=`They wanted ${FISH[o.fish].name.toLowerCase()}!`;
    else if(ex!==o.extra)msg=o.extra==="none"?"They wanted it plain!":`Add the ${EXTRA[o.extra].name.toLowerCase()}!`;
    bubble(msg,"oops");tone(220,.18);
    render();
  }
};

let ctx;
function tone(f,d){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.15,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d+.1);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+d+.12)}catch(e){}}
function confetti(n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cols=["#f2b134","#f4895f","#8fbf4a","#fbf7ef","#c8283c"];
  for(let i=0;i<n;i++){const c=document.createElement("div");c.className="confetti";c.style.left=Math.random()*100+"vw";c.style.background=pick(cols);c.style.animationDelay=Math.random()*.3+"s";document.body.append(c);setTimeout(()=>c.remove(),1900)}
}

seatGuests();newGoal();newOrder();ambientBelt();render();
</script>

</body>
</html>
