<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Lennox Game Space: Nigiri Builder plus learn-to-play academies for chess, fencing, tennis and flag football.">
<meta property="og:type" content="website">
<meta property="og:title" content="Lennox Game Space">
<meta property="og:description" content="Build sushi, learn chess, fence, play tennis and run flag football plays. Free games that teach a kid the real rules and words of each sport.">
<meta property="og:url" content="https://catnolapumpkin.github.io/nigiri-builder/">
<meta property="og:image" content="https://catnolapumpkin.github.io/nigiri-builder/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="627">
<meta name="twitter:card" content="summary_large_image">
<meta name="author" content="Catherina Brown">
<meta name="theme-color" content="#14102b">
<title>Lennox Game Space</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Fredoka:wght@400;500;600&display=swap">
<style>
/* Hub: a starry "game space" header with a tab per game; each game runs in its own frame so its state survives tab switches. */
:root{--space:#14102b;--space-2:#221a45;--paper:#fbf7ef;--gold:#f2b134;color-scheme:light;
  --display:"Mochiy Pop One","Arial Rounded MT Bold",system-ui,sans-serif;--body:"Fredoka","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--space);color:var(--paper);font-family:var(--body);display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header{flex:none;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));
  background:radial-gradient(1.5px 1.5px at 12% 30%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 38% 70%,#fff9 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 64% 22%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 85% 60%,#fffa 50%,transparent 51%),
  radial-gradient(1px 1px at 92% 18%,#fff8 50%,transparent 51%),linear-gradient(180deg,#1d1640,var(--space));
  border-bottom:2px solid rgba(255,255,255,.08)}
.top{display:flex;align-items:center;gap:10px;max-width:1100px;margin:0 auto}
.logo{width:38px;height:38px;flex:none}
h1{font-family:var(--display);font-weight:400;font-size:clamp(20px,5.4vw,28px);margin:0;letter-spacing:.3px;line-height:1.1}
h1 span{color:var(--gold)}
nav{display:flex;gap:6px;overflow-x:auto;max-width:1100px;margin:10px auto 0;padding-bottom:0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;display:flex;align-items:center;gap:7px;padding:9px 14px 11px;border-radius:14px 14px 0 0;color:var(--paper);text-decoration:none;
  font-weight:600;font-size:15px;background:rgba(255,255,255,.06);border:2px solid transparent;border-bottom:none;white-space:nowrap;-webkit-tap-highlight-color:transparent}
nav a svg{width:22px;height:22px;flex:none}
nav a[aria-current="page"]{background:var(--tab);color:var(--tab-ink,#1b1f2a)}
nav a:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
main{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:var(--space)}
iframe[hidden]{display:none}
</style>
</head>
<body>
<header>
  <div class="top">
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="15" fill="#f2b134"/><ellipse cx="24" cy="24" rx="23" ry="7" fill="none" stroke="#8fd3ff" stroke-width="3" transform="rotate(-20 24 24)"/><circle cx="19" cy="20" r="3" fill="#fff6" /><path d="M14 30 a12 12 0 0 0 20 0" fill="#e4572e" opacity=".35"/></svg>
    <h1>Lennox <span>Game Space</span></h1>
  </div>
  <nav aria-label="Games" id="tabs"></nav>
</header>
<main id="stage"></main>

<script>
const GAMES=[
  {id:"nigiri",name:"Nigiri Builder",file:"nigiri.html",tab:"#f2b134",
   icon:`<svg viewBox="0 0 32 32"><ellipse cx="16" cy="21" rx="12" ry="6" fill="#fdfcf7" stroke="#d9d2c0"/><path d="M5 18 Q7 10 16 11 Q25 10 27 18 Q25 21 16 20 Q7 21 5 18z" fill="#f4895f"/><path d="M11 12 q2 4 1 8 M16 11 q2 4 1 9 M21 12 q2 4 1 8" stroke="#ffd8c4" stroke-width="1.6" fill="none"/></svg>`},
  {id:"chess",name:"Chess",file:"chess.html",tab:"#e9c99a",
   icon:`<svg viewBox="0 0 32 32"><path d="M10 27h13l-1-4c3-3 4-8 1-12-2-3-6-5-9-4l1 3-5 5 2 2 4-2-4 6z" fill="#2b2420" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/><rect x="8" y="26" width="17" height="3" rx="1.5" fill="#2b2420" stroke="#fff" stroke-width="1.2"/></svg>`},
  {id:"fencing",name:"Fencing",file:"fencing.html",tab:"#dfe7f2",
   icon:`<svg viewBox="0 0 32 32"><path d="M5 5 L23 23 M27 5 L9 23" stroke="#c9d3e0" stroke-width="2.2" stroke-linecap="round"/><path d="M20 26 a5 5 0 0 1 6-6 M12 26 a5 5 0 0 0 -6-6" fill="none" stroke="#e4572e" stroke-width="2.4"/><circle cx="5" cy="5" r="1.8" fill="#8fd3ff"/><circle cx="27" cy="5" r="1.8" fill="#8fd3ff"/></svg>`},
  {id:"tennis",name:"Tennis",file:"tennis.html",tab:"#c8f169",
   icon:`<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="#d7f35a" stroke="#9cb92a"/><path d="M6 9 q10 7 0 15 M26 9 q-10 7 0 15" stroke="#fff" stroke-width="2" fill="none"/></svg>`},
  {id:"football",name:"Flag Football",file:"football.html",tab:"#8fd18a",
   icon:`<svg viewBox="0 0 32 32"><ellipse cx="16" cy="16" rx="13" ry="8" fill="#8b4a2b" transform="rotate(-30 16 16)"/><path d="M11 19 L21 13" stroke="#fff" stroke-width="1.6"/><path d="M13 15l2 3M15.5 13.6l2 3M18 12.2l2 3" stroke="#fff" stroke-width="1.2"/><path d="M3 27 q4 -4 8 0" stroke="#e4572e" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`}
];
const nav=document.getElementById("tabs"),stage=document.getElementById("stage");
const frames={};
nav.innerHTML=GAMES.map(g=>`<a href="#${g.id}" data-id="${g.id}" style="--tab:${g.tab}">${g.icon}<span>${g.name}</span></a>`).join("");
function open(){
  let id=location.hash.slice(1);
  if(!GAMES.some(g=>g.id===id))id="nigiri";
  const g=GAMES.find(x=>x.id===id);
  if(!frames[id]){const f=document.createElement("iframe");f.src=g.file;f.title=g.name;frames[id]=f;stage.append(f)}
  Object.entries(frames).forEach(([k,f])=>f.hidden=k!==id);
  nav.querySelectorAll("a").forEach(a=>{const on=a.dataset.id===id;if(on)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");if(on)a.scrollIntoView({block:"nearest",inline:"nearest"})});
  document.title=id==="nigiri"?"Lennox Game Space":`${g.name} · Lennox Game Space`;
}
addEventListener("hashchange",open);open();
</script>
</body>
</html>
